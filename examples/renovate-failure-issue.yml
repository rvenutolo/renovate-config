# Copy to .github/workflows/renovate-failure-issue.yml in a repository that
# uses the shared Renovate preset. It files an issue when CI fails on a
# Renovate PR, files one every Monday for each Renovate PR still stuck open
# after the weekend update window, and closes each issue when its PR closes.
# Every Sunday it also files one issue for the problems Renovate lists on its
# Dependency Dashboard, such as a failed lock-file update that left no PR.
#
# `workflows: [ci]` must name the repository's own CI workflow.
#
# The 0000000... SHA and v0.0.0 below are placeholders until the first release
# of rvenutolo/renovate-config; Renovate replaces them with the release's commit
# SHA and tag.
name: renovate-failure-issue
on:
  # Safe despite running with a write token: no PR code is checked out, the
  # untrusted branch name and run details travel only as reusable-workflow
  # inputs mapped to env, and the job requires the head to be in this repository.
  workflow_run:  # zizmor: ignore[dangerous-triggers]
    workflows: [ci]
    types: [completed]
  # pull_request does not fire for a PR with merge conflicts, which is exactly a
  # superseded or autoclosed Renovate PR. Safe for the same reasons as above: no
  # PR code is checked out, untrusted values travel as inputs mapped to env, and
  # the job requires the head to be in this repository.
  pull_request_target:  # zizmor: ignore[dangerous-triggers]
    types: [closed]
  # Off the hour, because GitHub delays scheduled runs most at the top of the
  # hour.
  schedule:
    # The sweep: Monday 14:17 UTC (9:17am EST, 10:17am EDT), the morning after
    # the window closes on Sunday 6pm. Change it freely; the sweep job's if:
    # names this exact string.
    - cron: '17 14 * * 1'
    # The problems check: Sunday 21:47 UTC (4:47pm EST, 5:47pm EDT), before
    # the window closes at 6pm New York time on either side of DST, so the
    # Dashboard it reads was written by a Renovate run inside the window.
    # Keep it inside the window; the problems job's if: names this string.
    - cron: '47 21 * * 0'
  # Runs the sweep and the problems check by hand.
  workflow_dispatch:
permissions: {}
jobs:
  open:
    # At job level, so non-matching runs are skipped rather than billed. The
    # same-repository check keeps a fork PR from a branch named renovate/x from
    # putting attacker-controlled log text into an issue. cancelled is
    # deliberately ignored. startup_failure, what a CI action bump outside the
    # Actions allowlist produces, is accepted, but GitHub fires no workflow_run
    # event for a run that fails at startup; the sweep job reports such a PR as
    # stuck instead.
    if: |-
      github.event_name == 'workflow_run'
      && startsWith(github.event.workflow_run.head_branch, 'renovate/')
      && github.event.workflow_run.head_repository.full_name == github.repository
      && contains(fromJSON('["failure", "timed_out", "startup_failure"]'), github.event.workflow_run.conclusion)
    permissions:
      issues: write  # create, update or close the failure issue; create its labels
      actions: read  # list the failed run's jobs and fetch their logs
      pull-requests: read  # find the PR for the failed branch
    # One open run per Renovate branch at a time, so parallel failures cannot
    # file duplicate issues. cancel-in-progress: false keeps a newer run from
    # killing a running one midway, but a group holds only one pending run and
    # a newer one replaces it. The close job has no group for that reason: a
    # pending close could otherwise be replaced and never run. An open run that
    # starts after its PR closed closes the issue itself, so whichever run comes
    # last leaves it closed. A job skipped by its if: does not enter the group,
    # so the skipped open job of a green CI run, a PR close or a sweep cannot
    # replace a pending open run.
    concurrency:
      group: renovate-failure-issue-${{ github.event.workflow_run.head_branch || github.event.pull_request.head.ref }}
      cancel-in-progress: false
    # The pinned path, SHA and tag comment run past common line limits.
    # yamllint disable-line rule:line-length
    uses: rvenutolo/renovate-config/.github/workflows/renovate-failure-issue.yml@0000000000000000000000000000000000000000  # v0.0.0
    with:
      mode: open
      run-id: ${{ format('{0}', github.event.workflow_run.id) }}
      run-url: ${{ github.event.workflow_run.html_url }}
      head-branch: ${{ github.event.workflow_run.head_branch }}
      run-conclusion: ${{ github.event.workflow_run.conclusion }}

  close:
    if: |-
      github.event_name == 'pull_request_target'
      && startsWith(github.event.pull_request.head.ref, 'renovate/')
      && github.event.pull_request.head.repo.full_name == github.repository
    permissions:
      issues: write  # record the outcome in the failure issue and close it
      pull-requests: read  # read the closed PR's details
    # The pinned path, SHA and tag comment run past common line limits.
    # yamllint disable-line rule:line-length
    uses: rvenutolo/renovate-config/.github/workflows/renovate-failure-issue.yml@0000000000000000000000000000000000000000  # v0.0.0
    with:
      mode: close
      pr-number: ${{ format('{0}', github.event.pull_request.number) }}
      pr-merged: ${{ format('{0}', github.event.pull_request.merged) }}

  sweep:
    if: (github.event_name == 'schedule' && github.event.schedule == '17 14 * * 1') || github.event_name == 'workflow_dispatch'
    permissions:
      issues: write  # create, update or close stuck issues; create their labels
      pull-requests: read  # list open PRs and read their mergeable state
      checks: read  # read the check runs on each PR's head commit
      statuses: read  # read the commit statuses on each PR's head commit
    # A sweep covers every PR, so it cannot share the per-branch group of the
    # open job; its own group keeps two sweeps from overlapping. It looks up a
    # PR's issue right before writing it, which narrows a race with an open run
    # for the same PR to seconds.
    concurrency:
      group: renovate-failure-issue-sweep
      cancel-in-progress: false
    # yamllint disable-line rule:line-length
    uses: rvenutolo/renovate-config/.github/workflows/renovate-failure-issue.yml@0000000000000000000000000000000000000000  # v0.0.0
    with:
      mode: sweep

  problems:
    if: (github.event_name == 'schedule' && github.event.schedule == '47 21 * * 0') || github.event_name == 'workflow_dispatch'
    permissions:
      issues: write  # read the Dependency Dashboard; create, update or close the problems issue; create its labels
    # Its own group, so two checks never overlap. The check needs Renovate's
    # Dependency Dashboard enabled, which the preset turns on.
    concurrency:
      group: renovate-failure-issue-problems
      cancel-in-progress: false
    # yamllint disable-line rule:line-length
    uses: rvenutolo/renovate-config/.github/workflows/renovate-failure-issue.yml@0000000000000000000000000000000000000000  # v0.0.0
    with:
      mode: problems
